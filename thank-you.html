<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You | 1StopCoverage.ca</title>

  <link rel="canonical" href="https://1stopcoverage.ca/thank-you.html" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .ty-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(140deg, var(--navy-dark) 0%, var(--navy) 50%, #1e4d8c 100%);
      padding: 40px 20px;
    }
    .ty-card {
      background: #fff;
      border-radius: 20px;

      max-width: 520px;
      width: 100%;
      padding: 48px 40px;
      text-align: center;
    }
    .ty-icon {
      width: 84px;
      height: 84px;
      margin: 0 auto 24px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--orange), #f59e0b);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ty-card h1 {
      color: var(--navy);
      font-size: 28px;
      margin: 0 0 12px;
    }
    .ty-card p {
      color: var(--text-muted);
      font-size: 16px;
      line-height: 1.6;
      margin: 0 0 28px;
    }
    .ty-logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
      text-decoration: none;
    }
    .ty-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }

</head>
<body>
  <div class="ty-wrap">

            <path d="M19 2L4 9v10c0 9.4 6.4 18.2 15 20 8.6-1.8 15-10.6 15-20V9L19 2z" fill="#1a3a6b"/>
            <path d="M19 2L4 9v10c0 9.4 6.4 18.2 15 20 8.6-1.8 15-10.6 15-20V9L19 2z" fill="url(#shield-grad)"/>
            <path d="M14 19l4 4 8-8" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <defs>
              <linearGradient id="shield-grad" x1="4" y1="2" x2="34" y2="32" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#1a3a6b"/>
                <stop offset="100%" stop-color="#e86c1a"/>

      <div class="ty-actions">
